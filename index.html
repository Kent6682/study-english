<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互動英文講義</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --accent: #ea580c;
      --gold: #b45309;
      --gold-bg: #fffbeb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      padding-bottom: 3rem;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
      padding: 2.6rem 1.5rem 2.4rem;
      text-align: center;
    }
    header h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 900; letter-spacing: 0.5px; }
    header p { color: #94a3b8; margin-top: 0.5rem; font-size: 1.05rem; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 1rem; }

    /* ===== 月份分頁籤＋搜尋 ===== */
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(248, 250, 252, 0.96); backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 0;
      margin-bottom: 1.4rem;
    }
    .toolbar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.45rem; flex: 1; }
    .tab {
      border: 1.5px solid var(--border); background: #fff; color: var(--ink);
      border-radius: 999px; padding: 0.4rem 0.95rem; font-size: 0.92rem; font-weight: 800;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .tab .count { color: var(--muted); font-weight: 700; font-size: 0.8rem; margin-left: 0.3rem; }
    .tab:hover { border-color: var(--primary); }
    .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .tab.active .count { color: #dbeafe; }
    .search {
      flex: 0 1 260px; min-width: 180px;
      border: 1.5px solid var(--border); border-radius: 999px;
      padding: 0.45rem 0.95rem; font-size: 0.92rem; font-family: inherit; background: #fff;
    }
    .search:focus { outline: none; border-color: var(--primary); }
    .view-title { font-size: 1.15rem; font-weight: 900; margin: 0 0 0.9rem; display: flex; align-items: baseline; gap: 0.6rem; }
    .view-title small { color: var(--muted); font-size: 0.85rem; font-weight: 700; }
    .empty { color: var(--muted); padding: 2rem 0; text-align: center; }

    /* ===== 精簡卡片 ===== */
    .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 1.1rem; }
    .unit-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); transition: transform 0.15s, box-shadow 0.15s;
    }
    .unit-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08); }
    .card-cover { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #e2e8f0; }
    .card-body { padding: 0.85rem 0.95rem 0.95rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag { font-size: 0.72rem; font-weight: 800; padding: 0.12rem 0.5rem; border-radius: 6px; background: #f1f5f9; color: #475569; }
    .tag.highlight { background: var(--primary-light); color: var(--primary); }
    .unit-title-en { font-size: 1rem; font-weight: 900; line-height: 1.3; }
    .unit-title-zh { font-size: 0.85rem; color: var(--muted); margin-top: -0.3rem; }
    .btn-main {
      display: block; text-align: center; text-decoration: none; margin-top: auto;
      background: var(--primary); color: #fff; font-weight: 800; font-size: 0.88rem;
      padding: 0.55rem 0.6rem; border-radius: 10px;
    }
    .btn-main:hover { background: #1d4ed8; }
    .btn-gsat {
      display: block; text-align: center; text-decoration: none;
      background: var(--gold-bg); color: var(--gold); border: 1.5px solid #f59e0b;
      font-weight: 800; font-size: 0.82rem; padding: 0.4rem 0.5rem; border-radius: 10px;
    }
    .btn-gsat:hover { background: #fef3c7; }
    .rewrite-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.3rem; }
    .btn-rewrite {
      text-align: center; text-decoration: none; font-size: 0.76rem; font-weight: 800;
      padding: 0.35rem 0.1rem; border-radius: 8px; border: 1px solid var(--border); color: #334155; background: #fff;
      white-space: nowrap;
    }
    .btn-rewrite:hover { border-color: var(--primary); color: var(--primary); }
    .sub-links { font-size: 0.75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .sub-links a { color: var(--muted); text-decoration: none; }
    .sub-links a:hover { color: var(--primary); text-decoration: underline; }
    noscript p { padding: 2rem 0; text-align: center; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1>互動英文講義</h1>
    <p>積木拆句・圖解文法・四大文體改寫・15題大考實戰</p>
  </header>

  <div class="toolbar">
    <div class="container toolbar-inner">
      <div class="tabs" id="tabs" role="tablist" aria-label="期數"></div>
      <input class="search" id="search" type="search" placeholder="🔍 搜尋單元（標題、主題）" aria-label="搜尋單元" />
    </div>
  </div>

  <main class="container">
    <div class="view-title" id="view-title"></div>
    <div class="unit-grid" id="grid"></div>
    <noscript><p>請開啟 JavaScript 以瀏覽講義列表。</p></noscript>
  </main>

  <script>
    /* ===== 單元清單：新增單元只要在這裡加一筆 =====
       issue：期數資料夾（YYYYMM）；n：單元號；dir：單元資料夾名稱；cover：封面圖檔名；
       stars：難度；topic：主題標籤；en / zh：英文與中文標題；docs：底部文件連結 [顯示文字, 檔名] */
    const UNITS = [
      { issue: '202610', n: 1, dir: 'Unit1_The Happy Prince', cover: '03_AI_視覺圖解講義.jpg', stars: '★☆☆', topic: '經典文學・童話',
        en: 'The Happy Prince', zh: '快樂王子（王爾德經典童話）',
        docs: [['📖 學習講義 (MD)', 'Unit1_The Happy Prince_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202610', n: 2, dir: 'Unit2_From Military Uniforms to Everyday Style', cover: '03_AI_視覺圖解講義.jpg', stars: '★☆☆', topic: '時尚生活・歷史',
        en: 'From Military Uniforms to Everyday Style', zh: '從軍服到日常穿搭',
        docs: [['📖 學習講義 (MD)', 'Unit2_From Military Uniforms to Everyday Style_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202610', n: 3, dir: 'Unit3_When AI Always Takes Your Side', cover: 'unit3_concept_infographic.jpg', stars: '★★★', topic: '科技與心理',
        en: 'When AI Always Takes Your Side', zh: '當 AI 只會當你的「應聲蟲」',
        docs: [['📖 課文原文 (MD)', '01_課文與字彙原文.md'], ['⚡ 文法詳解 (MD)', '02_深度文法與翻譯解析.md']] },
      { issue: '202610', n: 5, dir: 'Unit5_The Science and Culture of Coriander', cover: 'unit5_coriander_visual_storyboard.jpg', stars: '★★★', topic: '食物文化',
        en: 'The Science and Culture of Coriander', zh: '香菜背後的科學與文化',
        docs: [['📖 課文原文 (MD)', '01_課文與字彙原文.md'], ['⚡ 文法詳解 (MD)', '02_深度文法與翻譯解析.md']] },
      { issue: '202610', n: 7, dir: 'Unit7_Ariana Grande A Grande Rebirth', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '焦點人物',
        en: 'Ariana Grande: A Grand(e) Rebirth', zh: '亞莉安娜：天后的重生之路',
        docs: [['📖 課文原文 (MD)', '01_課文與字彙原文.md'], ['⚡ 文法詳解 (MD)', '02_深度文法與翻譯解析.md']] },
      { issue: '202610', n: 9, dir: 'Unit9_A Taste of Hawaii Exploring Oahu', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '旅遊好去處',
        en: 'A Taste of Hawaii: Exploring Oahu', zh: '夏威夷風情：漫遊歐胡島',
        docs: [['📖 課文原文 (MD)', '01_課文與字彙原文.md'], ['⚡ 文法詳解 (MD)', '02_深度文法與翻譯解析.md']] },
      { issue: '202610', n: 11, dir: 'Unit11_A Day in Disneyland Paris', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '閱讀素養・旅遊文化',
        en: 'A Day in Disneyland Paris & Scanning', zh: '巴黎迪士尼夢幻一日遊（含讀門秘笈：尋讀法）',
        docs: [['📖 課文原文 (MD)', '01_課文與字彙原文.md'], ['⚡ 文法詳解 (MD)', '02_深度文法與翻譯解析.md']] },
      { issue: '202610', n: 12, dir: 'Unit12_What Banknotes Tell Us About the Countries That Print Them', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '生活趣聞',
        en: 'What Banknotes Tell Us About the Countries That Print Them', zh: '紙鈔訴說著發行國家的故事',
        docs: [['📖 課文原文 (MD)', '01_課文與字彙原文.md'], ['⚡ 文法詳解 (MD)', '02_深度文法與翻譯解析.md']] },
      { issue: '202610', n: 14, dir: 'Unit14_Microhabits Small Wins Keep You Moving', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '身心成長',
        en: 'Microhabits: Small Wins Keep You Moving', zh: '微習慣：小小成功推動你持續前進',
        docs: [['📖 課文原文 (MD)', '01_課文與字彙原文.md'], ['⚡ 文法詳解 (MD)', '02_深度文法與翻譯解析.md']] },
      { issue: '202609', n: 1, dir: 'Unit1_Ali Baba and the 40 Thieves', cover: '03_AI_視覺圖解講義.jpg', stars: '★☆☆', topic: '經典文學・民間故事',
        en: 'Ali Baba and the 40 Thieves', zh: '阿里巴巴與四十大盜',
        docs: [['📖 學習講義 (MD)', 'Unit1_Ali Baba and the 40 Thieves_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202609', n: 2, dir: 'Unit2_From Market to Music', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '創意點子・音樂',
        en: "From Market to Music: Meet Vienna's Vegetable Orchestra", zh: '從市場到音樂廳：認識維也納蔬果管弦樂團',
        docs: [['📖 學習講義 (MD)', 'Unit2_From Market to Music_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202609', n: 4, dir: 'Unit4_The Wonderful World of Pikmin Bloom', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '數位生活・科技遊戲',
        en: 'The Wonderful World of Pikmin Bloom', zh: '走路、種花、打菇：皮克敏的繽紛世界',
        docs: [['📖 學習講義 (MD)', 'Unit4_The Wonderful World of Pikmin Bloom_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202609', n: 5, dir: 'Unit5_Phone-Free Dining', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '正反意見・科技與生活',
        en: 'Phone-Free Dining: The War Over Phones at the Table', zh: '用餐該禁手機嗎？餐桌上的手機論戰',
        docs: [['📖 學習講義 (MD)', 'Unit5_Phone-Free Dining_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202609', n: 8, dir: 'Unit8_The Sights of Nagoya', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '旅遊好去處・日本城市',
        en: 'The Sights of Nagoya', zh: '名古屋必訪景點：武士歷史、吉卜力公園與在地美食',
        docs: [['📖 學習講義 (MD)', 'Unit8_The Sights of Nagoya_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202609', n: 9, dir: 'Unit9_PinkPantheress', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '焦點人物・流行音樂',
        en: 'PinkPantheress: Queen of the Board and the Beat', zh: '粉紅豹女孩：棋盤高手，樂壇新女王',
        docs: [['📖 學習講義 (MD)', 'Unit9_PinkPantheress_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
      { issue: '202609', n: 10, dir: 'Unit10_Fish and Chips', cover: '03_AI_視覺圖解講義.jpg', stars: '★★★', topic: '閱讀素養・飲食文化',
        en: "Fish and Chips: Britain's Favorite Food & Skimming", zh: '炸魚薯條：英國最受歡迎的食物（含讀門秘笈：略讀法）',
        docs: [['📖 學習講義 (MD)', 'Unit10_Fish and Chips_學習講義.md'], ['⚡ 翻譯與解析 (TXT)', '02_中文翻譯與關鍵解析.txt']] },
    ];

    const REWRITES = [
      ['📰 報導', '04_改寫版1_客觀科普報導篇.html', '改寫版 1：客觀科普報導篇（同義替換）'],
      ['💬 你', '05_改寫版2_第二人稱代入篇.html', '改寫版 2：第二人稱代入篇（You 對話視角）'],
      ['📝 故事', '06_改寫版3_高中生故事記敘篇.html', '改寫版 3：第一人稱高中生故事篇（練學測記敘文）'],
      ['⚖️ 議論', '07_改寫版4_正反論證議論文篇.html', '改寫版 4：正反論證議論文篇（練學測論說文）'],
    ];

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const href = (u, file) => './' + u.issue + '/' + encodeURI(u.dir) + '/' + encodeURI(file);
    const issueLabel = issue => issue.slice(0, 4) + ' 年 ' + Number(issue.slice(4)) + ' 月號';
    const issues = [...new Set(UNITS.map(u => u.issue))].sort().reverse();

    function card(u) {
      const rw = REWRITES.map(([label, file, title]) =>
        `<a class="btn-rewrite" href="${href(u, file)}" title="${esc(title)}" aria-label="${esc(title)}">${label}</a>`).join('');
      const docs = u.docs.map(([label, file]) => `<a href="${href(u, file)}">${esc(label)}</a>`).join('<span>·</span>');
      return `<div class="unit-card">
        <img src="${href(u, u.cover)}" alt="Unit ${u.n} 封面" class="card-cover" loading="lazy" onerror="this.style.visibility='hidden';" />
        <div class="card-body">
          <div class="tag-row">
            <span class="tag highlight">UNIT ${u.n}</span>
            <span class="tag">${esc(u.stars)} 難度</span>
            <span class="tag">${esc(u.topic)}</span>
          </div>
          <div class="unit-title-en">${esc(u.en)}</div>
          <div class="unit-title-zh">${esc(u.zh)}</div>
          <a class="btn-main" href="${href(u, '03_互動圖文學習講義.html')}">🚀 開啟圖文互動講義（原版課文＋15題檢測）</a>
          <a class="btn-gsat" href="${href(u, '08_歷屆學測真題特訓.html')}" target="_blank">🏛️ 學測 15 題特訓 ↗</a>
          <div class="rewrite-row">${rw}</div>
          <div class="sub-links">${docs}</div>
        </div>
      </div>`;
    }

    const tabsEl = document.getElementById('tabs');
    const gridEl = document.getElementById('grid');
    const titleEl = document.getElementById('view-title');
    const searchEl = document.getElementById('search');
    let current = issues.includes(location.hash.slice(1)) ? location.hash.slice(1) : issues[0];

    function renderTabs() {
      tabsEl.innerHTML = issues.map(i => {
        const n = UNITS.filter(u => u.issue === i).length;
        const on = i === current && !searchEl.value.trim();
        return `<button class="tab${on ? ' active' : ''}" role="tab" aria-selected="${on}" data-issue="${i}">${issueLabel(i)}<span class="count">${n}</span></button>`;
      }).join('');
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      let list;
      if (q) {
        list = UNITS.filter(u => [u.en, u.zh, u.topic, 'unit ' + u.n].join(' ').toLowerCase().includes(q));
        titleEl.innerHTML = `搜尋「${esc(searchEl.value.trim())}」<small>共 ${list.length} 個單元（跨所有期數）</small>`;
      } else {
        list = UNITS.filter(u => u.issue === current);
        titleEl.innerHTML = `${issueLabel(current)}<small>共 ${list.length} 個單元</small>`;
      }
      list = list.slice().sort((a, b) => b.issue.localeCompare(a.issue) || a.n - b.n);
      gridEl.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">找不到符合的單元</div>';
      renderTabs();
    }

    tabsEl.addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      current = btn.dataset.issue;
      searchEl.value = '';
      history.replaceState(null, '', '#' + current);
      render();
    });
    searchEl.addEventListener('input', render);
    window.addEventListener('hashchange', () => {
      const h = location.hash.slice(1);
      if (issues.includes(h)) { current = h; searchEl.value = ''; render(); }
    });
    render();
  </script>
</body>
</html>
