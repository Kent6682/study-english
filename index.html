<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中英文雜誌數位互動講義庫｜Live 互動英文</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --accent: #ea580c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      padding-bottom: 3rem;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
      padding: 3rem 1.5rem 2.2rem;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    header p {
      color: #94a3b8;
      margin-top: 0.5rem;
      font-size: 1.05rem;
    }
    .container {
      max-width: 1100px;
      margin: -1.5rem auto 0;
      padding: 0 1.2rem;
    }
    .month-section {
      margin-top: 2.5rem;
    }
    .month-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
    }
    .month-badge {
      background: var(--primary);
      color: #fff;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.4rem;
    }
    .unit-card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px rgba(15,23,42,0.04);
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }
    .unit-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(37,99,235,0.12);
      border-color: #bfdbfe;
    }
    .card-cover {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e2e8f0;
      border-bottom: 1px solid var(--border);
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .tag-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }
    .tag {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      background: #f1f5f9;
      color: var(--muted);
    }
    .tag.highlight {
      background: #fef3c7;
      color: #92400e;
    }
    .unit-title-en {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.4;
      margin-bottom: 0.2rem;
    }
    .unit-title-zh {
      font-size: 0.98rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .btn-main {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .btn-main:hover {
      background: #1d4ed8;
    }
    .sub-links {
      display: flex;
      justify-content: space-around;
      margin-top: 0.7rem;
      padding-top: 0.7rem;
      border-top: 1px dashed var(--border);
      font-size: 0.84rem;
    }
    .sub-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .sub-links a:hover {
      color: var(--primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>高中英文雜誌數位互動講義庫</h1>
    <p>專為台灣高中生設計｜積木拆句・圖解文法・發音自測・隨時複習</p>
  </header>

  <div class="container">

    <!-- 2026 年 10 月號 -->
    <div class="month-section">
      <div class="month-header">
        <span class="month-badge">2026 年 10 月號</span>
        <span style="color:var(--muted);font-size:0.92rem;">Live 互動英文雜誌</span>
      </div>

      <div class="unit-grid">
        <!-- UNIT 3 CARD -->
        <div class="unit-card">
          <img src="./202610/Unit3_When%20AI%20Always%20Takes%20Your%20Side/unit3_concept_infographic.jpg" alt="Unit 3 封面" class="card-cover" />
          <div class="card-body">
            <div class="tag-row">
              <span class="tag highlight">UNIT 3</span>
              <span class="tag">★★★ 難度</span>
              <span class="tag">科技與心理</span>
              <span class="tag">Day 7</span>
            </div>
            <div class="unit-title-en">When AI Always Takes Your Side</div>
            <div class="unit-title-zh">當 AI 只會當你的「應聲蟲」</div>

            <a class="btn-main" href="./202610/Unit3_When%20AI%20Always%20Takes%20Your%20Side/03_互動圖文學習講義.html">
              🚀 開啟圖文互動講義
            </a>

            <div class="sub-links">
              <a href="./202610/Unit3_When%20AI%20Always%20Takes%20Your%20Side/01_課文與字彙原文.md">📖 課文原文</a>
              <span>·</span>
              <a href="./202610/Unit3_When%20AI%20Always%20Takes%20Your%20Side/02_深度文法與翻譯解析.md">⚡ 文法詳解</a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
